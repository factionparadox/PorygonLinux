// Porygon Firefox setup (autoconfig). This first line must stay a comment.
// Turns on userChrome.css and gives each profile Porygon's 1990s look once;
// after that the profile's own chrome/userChrome.css is left alone.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("browser.uidensity", 1);
defaultPref("browser.tabs.inTitlebar", 0);
defaultPref("widget.gtk.overlay-scrollbars.enabled", false);
defaultPref("browser.aboutwelcome.enabled", false);
try {
  let prof = Services.dirsvc.get("ProfD", Ci.nsIFile);
  let chrome = prof.clone(); chrome.append("chrome");
  let dst = chrome.clone(); dst.append("userChrome.css");
  if (!dst.exists()) {
    if (!chrome.exists()) chrome.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
    let src = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    src.initWithPath("/usr/lib/firefox/porygon/userChrome.css");
    src.copyTo(chrome, "userChrome.css");
  }
} catch (e) { Cu.reportError("Porygon: " + e); }

// --- privacy: telemetry, studies and sponsored content off.
// defaultPref, so you can still change any of these in about:config.
for (let [k, v] of [
  ["datareporting.healthreport.uploadEnabled", false],
  ["datareporting.policy.dataSubmissionEnabled", false],
  ["datareporting.usage.uploadEnabled", false],
  ["toolkit.telemetry.enabled", false],
  ["toolkit.telemetry.unified", false],
  ["toolkit.telemetry.archive.enabled", false],
  ["toolkit.telemetry.reportingpolicy.firstRun", false],
  ["app.shield.optoutstudies.enabled", false],
  ["app.normandy.enabled", false],
  ["browser.discovery.enabled", false],
  ["browser.crashReports.unsubmittedCheck.autoSubmit2", false],
  ["browser.newtabpage.activity-stream.showSponsored", false],
  ["browser.newtabpage.activity-stream.showSponsoredTopSites", false],
  ["browser.newtabpage.activity-stream.feeds.section.topstories", false],
  ["browser.newtabpage.activity-stream.feeds.telemetry", false],
  ["browser.newtabpage.activity-stream.telemetry", false],
  ["browser.urlbar.suggest.quicksuggest.sponsored", false],
  ["browser.urlbar.suggest.quicksuggest.nonsponsored", false],
  ["extensions.pocket.enabled", false],
  ["dom.private-attribution.submission.enabled", false],
  ["browser.ml.enabled", false],
  ["browser.ml.chat.enabled", false],
  ["privacy.globalprivacycontrol.enabled", true],
  ["privacy.trackingprotection.enabled", true],
  // spelling: the system's Hunspell dictionaries (British English, Russian)
  ["spellchecker.dictionary_path", "/usr/share/hunspell"],
  ["spellchecker.dictionary", "en-GB"],
]) { try { defaultPref(k, v); } catch (e) {} }

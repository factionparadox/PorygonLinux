# Porygon build-time pacman config: Manjaro stable + Porygon's own repo.
# @MIRROR@, @GPG@ and @REPO@ are filled in by build.sh.
[options]
HoldPkg     = pacman glibc manjaro-system
Architecture = auto
GPGDir      = @GPG@
CacheDir    = @CACHE@   # own cache: Arch and Manjaro packages can share file names
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = @MIRROR@/stable/$repo/$arch

[extra]
Server = @MIRROR@/stable/$repo/$arch

[multilib]
Server = @MIRROR@/stable/$repo/$arch

# Porygon's AUR-built packages (MaXX desktop and the old libraries it needs)
[porygon]
SigLevel = Optional TrustAll
Server = file://@REPO@

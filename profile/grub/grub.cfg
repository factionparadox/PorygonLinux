# Porygon boot menu (UEFI). The theme and its background are made by
# art/logo-assets.py at build time and live next to this file on the ISO.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod png
insmod all_video
insmod gfxterm

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
    if [ -f "(${root})/boot/grub/themes/porygon/theme.txt" ]; then
        set theme="(${root})/boot/grub/themes/porygon/theme.txt"
        export theme
    fi
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then uefi_machine_type_lower='x64'; fi
else
    archiso_platform='BIOS'
fi

default=porygon
timeout=5
timeout_style=menu

menuentry "Start Porygon" --class porygon --id 'porygon' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-7.2-x86_64 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-7.2-x86_64.img
}

menuentry "Start Porygon (show messages)" --class porygon --id 'porygon-verbose' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-7.2-x86_64 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-7.2-x86_64.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Memory test' --class memtest {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'Firmware settings' --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi
menuentry 'Power off' --class shutdown { halt }
